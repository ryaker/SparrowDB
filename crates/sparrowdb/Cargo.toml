[package]
name = "sparrowdb"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Embedded graph database with Cypher queries — no server, no subscription, no cloud"
documentation = "https://docs.rs/sparrowdb"
readme.workspace = true
keywords = ["graph", "database", "cypher", "embedded", "nosql"]
categories = ["database", "data-structures"]

[dependencies]
sparrowdb-common    = { workspace = true }
sparrowdb-storage   = { workspace = true }
sparrowdb-catalog   = { workspace = true }
sparrowdb-cypher    = { workspace = true }
sparrowdb-execution = { workspace = true }
rand                = { workspace = true }
rand_chacha         = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
clap                = { workspace = true }
tracing             = { workspace = true }
csv                 = { workspace = true }

[dev-dependencies]
tempfile        = { workspace = true }
serde_json      = { workspace = true }
criterion       = { workspace = true }
crc32fast       = { workspace = true }
sparrowdb-bench = { path = "../sparrowdb-bench" }
# Test-only: regression_456 counts `tracing::warn!` events to prove a damaged
# index warns once per incident rather than once per scanned row.
tracing-subscriber = { workspace = true }
# Re-declares sparrowdb-storage (already a normal dependency above) with its
# `test-hooks` feature enabled. Cargo unifies the two entries only for this
# crate's own test/bench targets; the library and bin targets above still
# build against the plain [dependencies] entry, so `test-hooks` never reaches
# a downstream consumer of the published `sparrowdb` crate. Needed by
# regression_464_quarantine_race.rs — see that file and
# VectorIndex::test_pause_before_quarantine_lock's doc comment.
sparrowdb-storage = { workspace = true, features = ["test-hooks"] }

[[bin]]
name = "sparrowdb-mcp"
path = "src/bin/sparrowdb-mcp.rs"

[[bin]]
name = "gen-encrypted-fixture"
path = "src/bin/gen-encrypted-fixture.rs"

[[bench]]
name    = "graph_benchmarks"
harness = false

[[bench]]
name    = "batch_benchmarks"
harness = false

[[bench]]
name    = "property_index_benchmarks"
harness = false

[[bench]]
name    = "pipeline_phase2_benchmarks"
harness = false

[[bench]]
name    = "snap_benchmarks"
harness = false
