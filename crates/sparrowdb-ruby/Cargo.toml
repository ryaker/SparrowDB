[package]
name = "sparrowdb-ruby"
version = "0.1.27"
edition = "2021"
# Ships as a Ruby gem (extconf.rb + Gemfile + lib/), not as a crate. It has never
# been published to crates.io and cannot be: its path dependencies carry no version
# requirement. The rubygems publish path is release.yml's commented-out job.
publish = false
license = "MIT OR Apache-2.0"
authors = ["Rich Yaker"]
description = "Ruby bindings for SparrowDB embedded graph database"
repository = "https://github.com/ryaker/SparrowDB"

[lib]
name = "sparrowdb_ruby"
crate-type = ["cdylib"]

[dependencies]
sparrowdb = { path = "../sparrowdb" }
sparrowdb-common = { path = "../sparrowdb-common" }
sparrowdb-execution = { path = "../sparrowdb-execution" }
magnus = { version = "0.8", features = ["rb-sys"] }
rb-sys = { version = "0.9" }

[features]
default = []
